name: Build ROM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup devkitPro
        uses: devkitPro/setup-devkitpro@v1
        with:
          packages: gba-dev

      - name: Install dependencies & build agbcc
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi libpng-dev python3
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-rom
          path: "*.gba"
