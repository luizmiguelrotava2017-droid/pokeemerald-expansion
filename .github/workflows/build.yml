name: Build ROM

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and devkitARM
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-arm-none-eabi git libpng-dev python3 wget
          wget https://devkitpro.org
          sudo dpkg -i devkitpro-pacman.amd64.deb
          sudo dkp-pacman -Syu --noconfirm gba-dev

      - name: Build agbcc
        run: |
          git clone https://github.com
          cd agbcc
          ./build.sh
          ./install.sh ..

      - name: Build ROM
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=/opt/devkitpro/devkitARM
          make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokemon-rom
          path: "*.gba"
